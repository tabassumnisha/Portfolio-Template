services:
  portfolio:
    build: .
    container_name: portfolio-cms
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/data/portfolio.sqlite3
    ports:
      - "${PORTFOLIO_PORT:-8080}:8080"
    volumes:
      - portfolio_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  portfolio_data:
