# Serves the static site in Project/ with nginx. No build step, no database, no secrets.
#   docker compose up -d      then open http://localhost:8080
#   docker compose down       to stop
# The host port can be changed with PORTFOLIO_PORT in a local .env (see .env.example).
services:
  portfolio:
    image: nginx:1.27-alpine
    container_name: portfolio-template
    ports:
      - "${PORTFOLIO_PORT:-8080}:80"
    volumes:
      - ./Project:/usr/share/nginx/html:ro
    restart: unless-stopped
